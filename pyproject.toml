[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blstm-mionet"
version = "1.0.0"
description = "B-LSTM-MIONet: Bayesian LSTM-based neural operators for learning the response of dynamical systems to length-variant input functions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Zhihao Kong" },
  { name = "Amirhossein Mollaali" },
  { name = "Christian Moya" },
  { name = "Na Lu" },
  { name = "Guang Lin" },
]
keywords = [
  "operator learning",
  "DeepONet",
  "MIONet",
  "LSTM",
  "Bayesian",
  "uncertainty quantification",
  "replica exchange SGLD",
  "dynamical systems",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "mlflow>=2.5",
  "tqdm>=4.65",
  "pyyaml>=6.0",
]

# PyTorch is selected through an extra so that `uv sync --extra cpu` pulls the
# small CPU wheel and `uv sync --extra cu126` / `--extra cu130` pull the CUDA
# builds. Exactly one of these extras must be enabled.
[project.optional-dependencies]
cpu = ["torch>=2.0"]
cu126 = ["torch>=2.0"]
cu130 = ["torch>=2.0"]

[dependency-groups]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "black>=24.0",
  "pre-commit>=3.5",
]
notebooks = [
  "jupyter",
  "ipykernel",
  "nbformat",
  "nbconvert",
]

[project.urls]
Homepage = "https://github.com/moodykong/bayesian-lstm-mionet"
Paper = "https://arxiv.org/abs/2311.16519"
Issues = "https://github.com/moodykong/bayesian-lstm-mionet/issues"

[project.scripts]
blstm-mionet = "blstm_mionet.cli.main:main"

[tool.uv]
default-groups = ["dev"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blstm_mionet = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]
# a verbatim copy of the research code, used as a legacy-format fixture
extend-exclude = "^/tests/data/"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
