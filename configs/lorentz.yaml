# Autonomous Lorenz 63 system (paper Sec. 4.1).
#
# Paths are relative to the directory the command is run from.
name: lorentz

data:
  system: lorentz
  t_max: 20.0 # T = 20 (s)
  step_size: 0.01 # fixed RK-4 step size Delta = 0.01 (s)
  n_sample: 5000 # 5000 initial values sampled from X0
  x_init_pts: # X0 = [-17, 20] x [-23, 28] x [0, 50]
    - [-17.0, 20.0]
    - [-23.0, 28.0]
    - [0.0, 50.0]
  control: null # autonomous: no input function is stored with the data
  output: data/lorentz_N_5000_h001_T20.npy
  seed: 999
  verbose: true

model:
  architecture: LSTM_MIONet # LSTM_MIONet | LSTM_DeepONet | DeepONet | DeepONet_Local
  branch_state:
    width: 200
    depth: 3
    activation: relu
  branch_memory:
    width: 200
    depth: 3
    activation: relu
    lstm_size: 100
    lstm_layer_num: 2
  trunk:
    width: 200
    depth: 3
    activation: relu
  use_bias: true

training:
  datafile: data/lorentz_N_5000_h001_T20.npy
  state_component: 0 # 0 = x(t), 1 = y(t), 2 = z(t)
  search_len: 2 # h_max = 0.02 (s) = 2 steps
  search_num: 4 # x replicated 4 times -> N_train = 20000 (the demo notebook uses 10)
  search_random: true
  offset: 0.0
  t_max: null # null keeps the whole trajectory
  scale_mode: "" # "" | normalize | min-max
  holdout_size: 0.1 # trajectories kept for the post-training report
  validation_split: 0.2 # of the training trajectories, used for early stopping
  learning_rate: 0.001
  batch_size: 200
  epochs: 1000
  validate_freq: 1
  use_scheduler: true
  scheduler_patience: 10
  scheduler_factor: 0.5
  loss_function: MSE
  early_stopping_epochs: 80
  monitor_metric: val_loss
  save_model: true
  registered_model_name: lorentz
  resume_model: null
  plot_trajs: true
  plot_idxs: [0]
  figure_dir: figures
  device: parallel # GPU index, "parallel" or "cpu"; falls back to CPU without CUDA
  experiment_name: lorentz
  run_name: lstm_mionet_lorentz
  verbose: true

inference:
  datafile: data/lorentz_N_100_h001_T20.npy
  model: models:/lorentz/latest # or runs:/<run id>/model
  run: "" # reSGLD run holding an ensemble, for infer-bayesian
  recursive: false
  teacher_forcing_prob: 1.0
  autonomous: true # rebuild the input function from the predicted states
  state_component: 0
  search_len: 2
  search_num: 200 # each trajectory replicated 200 times
  search_random: false
  offset: 0.0
  t_max: null
  scale_mode: ""
  batch_size: 100
  n_ensemble: 300 # M = 300 posterior samples are used in the paper
  plot_trajs: true
  plot_idxs: [0]
  figure_dir: figures
  device: 0
  verbose: true

tracking:
  uri: mlruns # overridden by MLFLOW_TRACKING_URI
