repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^uv\.lock$ # lockfiles are large by nature
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8 # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 26.5.1 # keep in step with the black version in uv.lock
    hooks:
      - id: black

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
