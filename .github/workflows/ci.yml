# Continuous integration for the B-LSTM-MIONet code release.
#
# The environment is fully described by pyproject.toml + uv.lock, so every step
# goes through uv: `uv sync --extra cpu` installs the CPU PyTorch wheel (torch
# is an extra: cpu / cu126 / cu130) together with the default `dev` dependency
# group that provides pytest, ruff and black.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch (or pull request) cancels the run that is
# still in flight; only the newest commit is worth testing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      # Every uv command in the job uses the matrix interpreter.  Without this,
      # `uv run` falls back to .python-version (3.10), rebuilds the virtual
      # environment and drops the `cpu` extra, so torch disappears.
      UV_PYTHON: ${{ matrix.python-version }}
      # MLflow prints an agent hint on import; the tests are head-less and log
      # into a temporary file store.
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MPLBACKEND: Agg

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0 # exact tag: setup-uv publishes no floating v10 major tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project and its CPU dependencies
        # --locked fails the job if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --extra cpu

      - name: Show the environment
        run: uv run --no-sync python -c "import sys, torch; print(sys.version); print('torch', torch.__version__)"

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src tests

      - name: Format check (black)
        run: uv run --no-sync black --check src tests

      - name: Test (pytest)
        run: uv run --no-sync pytest --durations=10
